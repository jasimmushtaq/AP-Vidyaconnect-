<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <style>
    .title { font-size: 22px; font-weight: bold; fill: #111; text-anchor: middle; }
    .box-title { font-size: 16px; font-weight: bold; fill: #111; text-anchor: middle; }
    .actor-label { font-size: 15px; font-weight: bold; fill: #111; text-anchor: middle; }
    .usecase-text { font-size: 13.5px; font-weight: 600; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    .boundary { fill: #ffffff; stroke: #222; stroke-width: 2; }
    .usecase { fill: #ffffff; stroke: #222; stroke-width: 1.8; }
    .line { stroke: #222; stroke-width: 1.6; }
    .actor-head { fill: #ffffff; stroke: #222; stroke-width: 2; }
    .actor-body { stroke: #222; stroke-width: 2; stroke-linecap: round; }
  </style>

  <!-- Diagram Title -->
  <text x="550" y="38" class="title">UML Use Case Diagram — AP VidyaConnect System</text>

  <!-- System Boundary Box -->
  <rect x="250" y="65" width="600" height="625" class="boundary"/>
  <text x="550" y="95" class="box-title">AP VidyaConnect System</text>

  <!-- ================= USE CASES (OVALS) ================= -->
  <!-- Top Center: User Authentication -->
  <ellipse cx="550" cy="140" rx="140" ry="24" class="usecase"/>
  <text x="550" y="140" class="usecase-text">User Authentication &amp; Login</text>

  <!-- Left Column Use Cases -->
  <ellipse cx="400" cy="225" rx="130" ry="24" class="usecase"/>
  <text x="400" y="225" class="usecase-text">Browse &amp; Apply Internships</text>

  <ellipse cx="400" cy="315" rx="130" ry="24" class="usecase"/>
  <text x="400" y="315" class="usecase-text">Mark Geofenced Attendance</text>

  <ellipse cx="400" cy="405" rx="130" ry="24" class="usecase"/>
  <text x="400" y="405" class="usecase-text">Submit Milestone Tasks</text>

  <ellipse cx="400" cy="495" rx="130" ry="24" class="usecase"/>
  <text x="400" y="495" class="usecase-text">Manage Student Cohorts</text>

  <!-- Right Column Use Cases -->
  <ellipse cx="700" cy="225" rx="130" ry="24" class="usecase"/>
  <text x="700" y="225" class="usecase-text">Create &amp; Sign MoUs</text>

  <ellipse cx="700" cy="315" rx="130" ry="24" class="usecase"/>
  <text x="700" y="315" class="usecase-text">Post Internship Opportunities</text>

  <ellipse cx="700" cy="405" rx="130" ry="24" class="usecase"/>
  <text x="700" y="405" class="usecase-text">Evaluate Intern Tasks</text>

  <ellipse cx="700" cy="495" rx="130" ry="24" class="usecase"/>
  <text x="700" y="495" class="usecase-text">Verify Institutional Partners</text>

  <!-- Bottom Center: View Reports & Analytics -->
  <ellipse cx="550" cy="620" rx="150" ry="26" class="usecase"/>
  <text x="550" y="620" class="usecase-text">View Reports &amp; Analytics</text>

  <!-- ================= ACTOR 1: Student (Top Left) ================= -->
  <g transform="translate(110, 200)">
    <circle cx="0" cy="0" r="16" class="actor-head"/>
    <line x1="0" y1="16" x2="0" y2="60" class="actor-body"/>
    <line x1="-22" y1="34" x2="22" y2="34" class="actor-body"/>
    <line x1="0" y1="60" x2="-20" y2="98" class="actor-body"/>
    <line x1="0" y1="60" x2="20" y2="98" class="actor-body"/>
    <text x="0" y="125" class="actor-label">Student</text>
  </g>

  <!-- ================= ACTOR 2: College Admin (Bottom Left) ================= -->
  <g transform="translate(110, 480)">
    <circle cx="0" cy="0" r="16" class="actor-head"/>
    <line x1="0" y1="16" x2="0" y2="60" class="actor-body"/>
    <line x1="-22" y1="34" x2="22" y2="34" class="actor-body"/>
    <line x1="0" y1="60" x2="-20" y2="98" class="actor-body"/>
    <line x1="0" y1="60" x2="20" y2="98" class="actor-body"/>
    <text x="0" y="125" class="actor-label">College Admin</text>
  </g>

  <!-- ================= ACTOR 3: Company Admin (Top Right) ================= -->
  <g transform="translate(980, 200)">
    <circle cx="0" cy="0" r="16" class="actor-head"/>
    <line x1="0" y1="16" x2="0" y2="60" class="actor-body"/>
    <line x1="-22" y1="34" x2="22" y2="34" class="actor-body"/>
    <line x1="0" y1="60" x2="-20" y2="98" class="actor-body"/>
    <line x1="0" y1="60" x2="20" y2="98" class="actor-body"/>
    <text x="0" y="125" class="actor-label">Company Admin</text>
  </g>

  <!-- ================= ACTOR 4: Super Admin (Bottom Right) ================= -->
  <g transform="translate(980, 480)">
    <circle cx="0" cy="0" r="16" class="actor-head"/>
    <line x1="0" y1="16" x2="0" y2="60" class="actor-body"/>
    <line x1="-22" y1="34" x2="22" y2="34" class="actor-body"/>
    <line x1="0" y1="60" x2="-20" y2="98" class="actor-body"/>
    <line x1="0" y1="60" x2="20" y2="98" class="actor-body"/>
    <text x="0" y="125" class="actor-label">Super Admin</text>
  </g>

  <!-- ================= ASSOCIATION LINES ================= -->
  <!-- Student (Center: 110, 235) -->
  <line x1="135" y1="230" x2="415" y2="148" class="line"/> <!-- to Auth -->
  <line x1="135" y1="230" x2="270" y2="225" class="line"/> <!-- to Apply -->
  <line x1="135" y1="235" x2="275" y2="310" class="line"/> <!-- to Attendance -->
  <line x1="135" y1="240" x2="285" y2="395" class="line"/> <!-- to Milestone -->

  <!-- College Admin (Center: 110, 515) -->
  <line x1="135" y1="500" x2="445" y2="160" class="line"/> <!-- to Auth -->
  <line x1="135" y1="510" x2="270" y2="495" class="line"/> <!-- to Manage Cohorts -->
  <line x1="135" y1="515" x2="600" y2="242" class="line"/> <!-- to Create MoUs -->
  <line x1="135" y1="525" x2="425" y2="610" class="line"/> <!-- to Analytics -->

  <!-- Company Admin (Center: 980, 235) -->
  <line x1="955" y1="230" x2="685" y2="148" class="line"/> <!-- to Auth -->
  <line x1="955" y1="230" x2="825" y2="225" class="line"/> <!-- to Create MoUs -->
  <line x1="955" y1="235" x2="825" y2="310" class="line"/> <!-- to Post Internships -->
  <line x1="955" y1="240" x2="815" y2="395" class="line"/> <!-- to Evaluate Tasks -->
  <line x1="955" y1="245" x2="675" y2="610" class="line"/> <!-- to Analytics -->

  <!-- Super Admin (Center: 980, 515) -->
  <line x1="955" y1="500" x2="655" y2="160" class="line"/> <!-- to Auth -->
  <line x1="955" y1="510" x2="825" y2="495" class="line"/> <!-- to Verify Partners -->
  <line x1="955" y1="520" x2="695" y2="620" class="line"/> <!-- to Analytics -->
</svg>
