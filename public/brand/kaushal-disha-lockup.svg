<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%" fill="none">
  <!-- Kaushal Disha Full Horizontal Lockup -->
  <!-- Brand Mark on Left -->
  <g transform="translate(140, 140) scale(0.68)">
    <!-- Ashoka Chakra upper-left segment -->
    <g transform="translate(-50, -45)">
      <circle cx="0" cy="0" r="82" stroke="#0E2350" stroke-width="4" fill="none" stroke-dasharray="2 3" opacity="0.35" />
      <circle cx="0" cy="0" r="76" stroke="#0E2350" stroke-width="3" fill="none" opacity="0.85" />
      <g stroke="#0E2350" stroke-width="2.2" opacity="0.75">
        <line x1="0" y1="-76" x2="0" y2="76" />
        <line x1="-76" y1="0" x2="76" y2="0" />
        <line x1="-53.7" y1="-53.7" x2="53.7" y2="53.7" />
        <line x1="-53.7" y1="53.7" x2="53.7" y2="-53.7" />
        <line x1="-29.1" y1="-70.2" x2="29.1" y2="70.2" />
        <line x1="-70.2" y1="-29.1" x2="70.2" y2="29.1" />
        <line x1="-70.2" y1="29.1" x2="70.2" y2="-29.1" />
        <line x1="-29.1" y1="70.2" x2="29.1" y2="-70.2" />
      </g>
      <circle cx="0" cy="0" r="14" fill="#0E2350" />
    </g>

    <!-- Outer Saffron & Green Ring -->
    <path d="M -145,0 A 145 145 0 0 1 50,-136" fill="none" stroke="#F07421" stroke-width="16" stroke-linecap="round" />
    <path d="M 50,136 A 145 145 0 0 1 -115,88" fill="none" stroke="#1C8A3C" stroke-width="16" stroke-linecap="round" />

    <!-- Stylized Human Figure / Head -->
    <circle cx="-35" cy="-55" r="18" fill="#0E2350" />

    <!-- Rising Sweeping Curves (Navy, Saffron, Green) with Arrowhead -->
    <path d="M -90,75 C -40,75 10,25 45,-35 C 70,-80 85,-110 95,-125" fill="none" stroke="#1C8A3C" stroke-width="14" stroke-linecap="round" />
    <path d="M -100,50 C -55,45 -5,0 30,-55 C 55,-95 72,-125 82,-140" fill="none" stroke="#F07421" stroke-width="14" stroke-linecap="round" />
    <path d="M -95,-15 C -65,-30 -35,-20 0,-70 C 30,-115 50,-140 70,-160" fill="none" stroke="#0E2350" stroke-width="22" stroke-linecap="round" />
    <polygon points="50,-175 110,-155 85,-100 72,-132" fill="#0E2350" />
    <path d="M -145,30 C -135,70 -100,120 -40,125 C -10,128 30,110 50,85 C 35,90 10,95 -15,90 C -55,80 -80,50 -90,25 C -95,15 -105,15 -115,30 C -125,45 -135,45 -145,30 Z" fill="#0E2350" />
  </g>

  <!-- Wordmark "KAUSHAL DISHA" on Right -->
  <g transform="translate(280, 0)">
    <!-- Line 1: KAUSHAL -->
    <g transform="translate(0, 115)">
      <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="82" letter-spacing="4" fill="#0E2350">
        <tspan x="0">K</tspan>
        <tspan x="70">A</tspan>
        <tspan x="145">U</tspan>
        <tspan x="220">S</tspan>
        <tspan x="285">H</tspan>
        <tspan x="360">A</tspan>
        <tspan x="435">L</tspan>
      </text>
      <!-- Saffron apex fill on first A of KAUSHAL -->
      <polygon points="108.5, -42 121, -66 133.5, -42" fill="#F07421" />
    </g>

    <!-- Line 2: DISHA -->
    <g transform="translate(0, 205)">
      <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="82" letter-spacing="4" fill="#0E2350">
        <tspan x="0">D</tspan>
        <tspan x="75">I</tspan>
        <tspan x="115">S</tspan>
        <tspan x="180">H</tspan>
        <tspan x="255">A</tspan>
      </text>
      <!-- Green apex fill on A of DISHA -->
      <polygon points="293.5, -42 306, -66 318.5, -42" fill="#1C8A3C" />
    </g>

    <!-- Subtitle: Hindi Tagline / Platform Identity -->
    <g transform="translate(2, 245)">
      <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="600" font-size="16" letter-spacing="1.5" fill="#6B7280">
        INSTITUTION – INDUSTRY INTERNSHIP PLATFORM
      </text>
    </g>
  </g>
</svg>
